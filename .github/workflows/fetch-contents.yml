name: Fetch contents

on:
  workflow_dispatch:
    inputs:
      source:
        description: "対象の情報源ID(カンマ区切り、空なら全件)"
        required: false
        default: ""
  # 毎日 JST 5:23 に新着記事を取得する
  schedule:
    - cron: "23 20 * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: fetch-contents
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Fetch new contents
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          SOURCE: ${{ inputs.source }}
        run: |
          if [ -n "$SOURCE" ]; then
            pnpm fetch-contents --source="$SOURCE"
          else
            pnpm fetch-contents
          fi

      # 取得した記事でサイトが壊れないことを確認してから反映する
      - name: Test and build
        run: |
          pnpm test
          pnpm build

      - name: Commit and push
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/contents.json public/images/contents
          if git diff --cached --quiet; then
            echo "No changes"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Add content $(TZ=Asia/Tokyo date +%Y-%m-%d)"
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      # GITHUB_TOKEN による push ではデプロイが起動しないため明示的に実行する
      - name: Trigger deploy
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref "${{ github.ref_name }}"
